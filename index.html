<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊本県 全高校・高専未来キャリアシミュレーター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'M PLUS Rounded 1c', sans-serif;
            background-color: #f8fafc;
        }
        .rounded-font {
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .gradient-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .table-sticky-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 10;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="gradient-hero text-white py-6 px-4 shadow-md relative overflow-hidden">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-4 relative z-10">
            <div>
                <span class="bg-amber-400 text-slate-900 font-bold text-xs px-3 py-1 rounded-full inline-block mb-2 shadow">
                    <i class="fa-solid fa-location-dot mr-1"></i> 熊本県内 全高校・高専 完全対応版
                </span>
                <h1 class="text-2xl md:text-3xl font-extrabold rounded-font tracking-wide">
                    熊本未来ナビ 〜高校・高専 進路比較シミュレーター〜
                </h1>
                <p class="text-blue-100 text-xs md:text-sm mt-1">
                    気になる学校を選んで、将来の大学進学・TSMC/地元大手就職・想定年収をシミュレーション＆比較！
                </p>
            </div>
            
            <!-- Mode Switch Tabs -->
            <div class="bg-white/10 backdrop-blur-md p-1.5 rounded-2xl border border-white/20 flex gap-2 shrink-0 self-stretch md:self-auto justify-center">
                <button id="tabSingleBtn" onclick="switchMainTab('single')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-white text-blue-900 shadow">
                    <i class="fa-solid fa-user text-blue-600"></i> 1校詳細モード
                </button>
                <button id="tabCompareBtn" onclick="switchMainTab('compare')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 text-white hover:bg-white/10">
                    <i class="fa-solid fa-code-compare text-amber-300"></i> 3校比較モード
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto w-full px-4 py-6 flex-grow">
        
        <!-- ================= MODE 1: SINGLE SCHOOL SIMULATION ================= -->
        <div id="singleModeView" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Controls (4 cols) -->
            <div class="lg:col-span-4 space-y-5">
                
                <!-- Step 1: Select School (絞り込み非表示・ダイレクト選択) -->
                <div class="bg-white rounded-2xl p-5 card-shadow border border-slate-100">
                    <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center">
                        <span class="bg-blue-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 shadow">1</span>
                        志望校（高校・高専）を選ぶ
                    </h2>

                    <!-- Select Box (全校検索) -->
                    <div class="mb-2">
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">
                            <i class="fa-solid fa-magnifying-glass text-blue-500 mr-1"></i> 学校・学科名を選択
                        </label>
                        <select id="schoolSelect" onchange="onSchoolSelect(this.value)" class="w-full border-2 border-blue-500 rounded-xl p-2.5 text-sm font-bold text-slate-800 bg-blue-50/40 focus:ring-2 focus:ring-blue-500 outline-none">
                            <!-- Injected dynamically -->
                        </select>
                    </div>
                </div>

                <!-- Step 2: Pathway Choice -->
                <div class="bg-white rounded-2xl p-5 card-shadow border border-slate-100">
                    <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center">
                        <span class="bg-blue-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 shadow">2</span>
                        卒業後のルートを選択
                    </h2>

                    <div class="grid grid-cols-2 gap-3" id="pathwayChoices">
                        <button id="pathUnivBtn" onclick="setPathway('univ')" class="p-3 border-2 rounded-xl text-center transition font-bold flex flex-col items-center justify-center gap-1 border-blue-500 bg-blue-50 text-blue-700">
                            <i class="fa-solid fa-graduation-cap text-2xl"></i>
                            <span class="text-xs" id="univBtnLabel">大学・短大進学</span>
                        </button>
                        <button id="pathEmpBtn" onclick="setPathway('emp')" class="p-3 border-2 border-slate-200 rounded-xl text-center transition font-bold flex flex-col items-center justify-center gap-1 text-slate-600 hover:bg-slate-50">
                            <i class="fa-solid fa-briefcase text-2xl"></i>
                            <span class="text-xs" id="empBtnLabel">卒業後 直接就職</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Dashboard (8 cols) -->
            <div class="lg:col-span-8 space-y-5">

                <!-- Summary Banner -->
                <div class="bg-white rounded-2xl p-5 card-shadow border border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                        <span id="selectedSchoolBadge" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">
                            国立5年制高専
                        </span>
                        <h2 id="displaySchoolName" class="text-xl md:text-2xl font-black text-slate-800 mt-1 rounded-font">
                            熊本高等専門学校（熊本キャンパス）
                        </h2>
                        <p class="text-xs text-slate-500 mt-1" id="schoolDescription">
                            情報通信・制御・人間情報。5年制で即戦力エンジニア育成および難関国立大編入。
                        </p>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 text-center w-full sm:w-auto justify-around shrink-0">
                        <div>
                            <div class="text-xs text-slate-500 font-semibold" id="statUnivLabel">進学率</div>
                            <div id="statUnivRate" class="text-lg font-extrabold text-blue-600">35%</div>
                        </div>
                        <div class="h-7 w-px bg-slate-200"></div>
                        <div>
                            <div class="text-xs text-slate-500 font-semibold" id="statEmpLabel">就職率</div>
                            <div id="statEmpRate" class="text-lg font-extrabold text-emerald-600">65%</div>
                        </div>
                    </div>
                </div>

                <!-- Student Voice & Growth Content Card -->
                <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-5 card-shadow border border-blue-100 space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-face-smile mr-1"></i> 在校生のリアルな声 & 成長ポイント
                        </span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div class="bg-white p-3.5 rounded-xl border border-blue
